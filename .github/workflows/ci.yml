name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: platform-tests
    if: ${{ always() }}
    timeout-minutes: 5

    steps:
      - name: Verify platform results
        env:
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
        run: test "${PLATFORM_RESULT}" = "success"
